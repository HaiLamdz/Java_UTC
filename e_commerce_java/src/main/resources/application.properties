# ==============================================================
# CẤU HÌNH DỰ ÁN WEB THƯƠNG MẠI ĐIỆN TỬ BÁN SÁCH (BOOKSTORE)
# ==============================================================

spring.application.name=bookstore
server.port=8080

# Cấu hình encoding UTF-8 tiếng Việt
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==============================================================
# LỰA CHỌN 1 (MẶC ĐỊNH): CƠ SỞ DỮ LIỆU ORACLE DATABASE
# (Oracle 23ai / 21c / 19c / XE - Phục vụ BTL Java & Oracle DB)
# ==============================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=bookstore
spring.datasource.password=123456

# Hibernate ORM Dialect dành cho Oracle Database
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

