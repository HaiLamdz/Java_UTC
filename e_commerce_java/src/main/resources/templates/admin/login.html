<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Nội Bộ - CMS</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=3)}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.admin-login-page {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.3) 0px, transparent 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle ambient glow decoration */
        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: fadeInDown 0.35s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .admin-brand-header {
            margin-bottom: 26px;
            text-align: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
        }

        .brand-icon-box {
            width: 48px;
            height: 48px;
            background: #0f172a;
            color: #ffffff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.3);
        }

        .brand-icon-box svg {
            width: 24px;
            height: 24px;
        }

        .admin-brand-header h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .admin-brand-header p {
            font-size: 0.86rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Form Group */
        .admin-form-group {
            margin-bottom: 20px;
        }

        .admin-label {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
            letter-spacing: -0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
        }

        .input-wrapper:focus-within .input-icon {
            color: #2563eb;
        }

        .admin-input {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 42px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 500;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
        }

        .admin-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .admin-input:hover {
            border-color: #94a3b8;
            background: #ffffff;
        }

        .admin-input:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.12);
        }

        /* Password toggle button */
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s ease;
        }

        .toggle-password:hover {
            color: #334155;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .has-toggle {
            padding-right: 42px;
        }

        /* Error text */
        .form-error {
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            height: 46px;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid #0f172a;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.15);
            margin-top: 6px;
        }

        .btn-submit:hover {
            background: #1e293b;
            border-color: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -2px rgba(15, 23, 42, 0.25);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.15);
        }

        .btn-submit svg {
            width: 18px;
            height: 18px;
            transition: transform 0.15s ease;
        }

        .btn-submit:hover svg {
            transform: translateX(2px);
        }

        /* Card Footer Link */
        .login-back-link {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }

        .login-back-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .login-back-link a:hover {
            color: #0f172a;
        }

        /* Security Footnote */
        .login-footnote {
            margin-top: 22px;
            text-align: center;
            font-size: 0.76rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .login-footnote svg {
            width: 14px;
            height: 14px;
            color: #475569;
        }
    </style>
</head>
<body class="admin-login-page">

    <div class="ambient-glow"></div>

    <div class="login-wrapper">
        <div class="admin-login-card">
            <div class="admin-brand-header">
                <div class="brand-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div>
                    <div class="brand-badge">
                        <span class="status-dot"></span>
                        Internal Backoffice
                    </div>
                </div>
                <h1>Quản Trị Kho Sách</h1>
                <p>Xác thực quyền quản trị viên để vào bảng điều khiển</p>
            </div>

            <div th:replace="~{admin/layout :: alerts}"></div>

            <form action="/admin/login" method="POST" th:object="${loginForm}">
                <div class="admin-form-group">
                    <label class="admin-label" for="username">Tài khoản quản trị</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input id="username" type="text" th:field="*{username}" class="admin-input" placeholder="Mã nhân sự hoặc tên đăng nhập" required autofocus>
                    </div>
                    <div class="form-error" th:if="${#fields.hasErrors('username')}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px; height:14px;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label class="admin-label" for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input id="password" type="password" th:field="*{password}" class="admin-input has-toggle" placeholder="Nhập mật khẩu quản trị" required>
                        <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Hiện/ẩn mật khẩu">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeOffIcon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="form-error" th:if="${#fields.hasErrors('password')}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px; height:14px;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <div style="margin-top: 26px;">
                    <button type="submit" class="btn-submit">
                        <span>Đăng Nhập Quản Trị</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </form>

            <div class="login-back-link">
                <a href="/">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px;">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Quay lại trang chủ cửa hàng</span>
                </a>
            </div>
        </div>

        <div class="login-footnote">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Bảo mật hệ thống nội bộ &bull; Chỉ nhân sự được cấp quyền</span>
        </div>
    </div>

    <script>
        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = pwdInput.getAttribute('type') === 'password';
                pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.style.display = isPassword ? 'none' : 'block';
                eyeOffIcon.style.display = isPassword ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
