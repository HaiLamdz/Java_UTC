<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập &mdash; BookStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=8)}">
</head>
<body>

    <!-- Header Fragment -->
    <div th:replace="~{layout/header :: header}"></div>

    <main class="container">
        <!-- Alerts Fragment -->
        <div th:replace="~{layout/alerts :: alerts}"></div>

        <div class="auth-box">
            <div class="auth-header">
                <h1>Đăng Nhập</h1>
                <p>Đăng nhập tài khoản bạn đọc để quản lý đơn hàng và địa chỉ nhận sách</p>
            </div>

            <form action="/login" method="POST" th:object="${loginForm}">
                <div class="form-group">
                    <label class="form-label">Tên tài khoản</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Tên đăng nhập" required autofocus>
                    <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Lỗi tên tài khoản</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Mật khẩu" required>
                    <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Lỗi mật khẩu</div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Đăng Nhập
                    </button>
                </div>

                <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--ink-500);">
                    Chưa có tài khoản? <a href="/register" style="color: var(--ink-900); font-weight: 600; text-decoration: underline;">Đăng ký thành viên</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
