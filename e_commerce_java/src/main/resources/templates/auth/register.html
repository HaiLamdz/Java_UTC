<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Mới - BookStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=8)}">
</head>
<body>

    <!-- Header Fragment -->
    <div th:replace="~{layout/header :: header}"></div>

    <main class="container">
        <!-- Alerts Fragment -->
        <div th:replace="~{layout/alerts :: alerts}"></div>

        <div class="auth-box" style="max-width: 540px;">
            <div class="auth-header">
                <h1>Tạo Tài Khoản Bạn Đọc</h1>
                <p>Gia nhập cộng đồng người yêu sách BookStore</p>
            </div>

            <form action="/register" method="POST" th:object="${registerForm}">
                <div class="form-group">
                    <label class="form-label">Tên đăng nhập <span style="color:var(--crimson)">*</span></label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Tối thiểu 3 ký tự" required>
                    <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Lỗi</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Mật khẩu <span style="color:var(--crimson)">*</span></label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Lỗi</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Xác nhận mật khẩu <span style="color:var(--crimson)">*</span></label>
                        <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Lỗi</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Họ và tên của bạn <span style="color:var(--crimson)">*</span></label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Ví dụ: Trần Văn Nam" required>
                    <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Lỗi</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label">Địa chỉ Email <span style="color:var(--crimson)">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com" required>
                        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" th:field="*{phone}" class="form-control" placeholder="09xxxxxxxxx">
                        <div class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Lỗi</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Địa chỉ giao hàng mặc định</label>
                    <textarea th:field="*{address}" class="form-control" rows="2" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..."></textarea>
                    <div class="form-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Lỗi</div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Hoàn Tất Đăng Ký
                    </button>
                </div>

                <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--ink-500);">
                    Đã có tài khoản? <a href="/login" style="color: var(--ink-900); font-weight: 600;">Đăng nhập ngay</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
